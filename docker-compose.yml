services:
  db:
    image: postgres:16-alpine
    container_name: ascension-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ascension
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ascension"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ascension?schema=public
      DIRECT_URL: postgresql://postgres:postgres@db:5432/ascension?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_NAME: Ascension
      AUTH_SECRET: local-development-secret-change-me
      AUTH_TRUST_HOST: "true"
    ports:
      - "3000:3000"

volumes:
  postgres-data:
