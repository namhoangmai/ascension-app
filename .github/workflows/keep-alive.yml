name: Keep-alive ping

on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          if [ -z "${{ vars.APP_HEALTH_URL }}" ]; then
            echo "APP_HEALTH_URL repository variable is not set — skipping." >&2
            exit 1
          fi
          curl -fsS "${{ vars.APP_HEALTH_URL }}"
